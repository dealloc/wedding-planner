# fly.toml app configuration file generated for wedding-planner-copper-wave-4117 on 2026-09-29T09:26:20+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wedding-planner-copper-wave-4117'
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]
[env]
  DATABASE_PATH = '/mnt/wedding_planner/wedding-planner.db'
  PHX_HOST = 'wedding-planner.dealloc.be'
  WEBAUTHN_RP_ID = 'wedding-planner.dealloc.be'
  PORT = '8080'
  UPLOADS_PATH = '/mnt/wedding_planner/uploads'

[[mounts]]
  source = 'wedding_planner'
  destination = '/mnt/wedding_planner'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
