# Litestream configuration (NFR-04, D-32).
#
# Covers ONLY the SQLite database. It does not — and cannot — cover the uploads
# directory on the same volume; Litestream replicates the SQLite WAL, not arbitrary
# files on disk. See rel/overlays/bin/uploads-sync-loop and DEPLOY.md for the other half
# of NFR-04's backup story.
#
# All bucket identity/credentials below are runtime configuration (env vars, expanded by
# Litestream itself via ${VAR} substitution — see
# https://litestream.io/reference/config/#environment-variables). None of them are baked
# into this file or the image; every ${VAR} here MUST be set at deploy time (via `fly
# secrets set`, see DEPLOY.md) or Litestream/the entrypoint refuses to start.
#
# DATABASE_PATH is the same env var config/runtime.exs and fly.toml already use for the
# Ecto repo (single source of truth for the DB's location on the mounted volume).
dbs:
  - path: ${DATABASE_PATH}
    replica:
      type: s3
      bucket: ${BACKUP_BUCKET}
      # "db/" keeps the database replica and the uploads sync (which writes under
      # "uploads/" in the very same bucket, see uploads-sync-loop) from ever colliding.
      path: db
      endpoint: ${BACKUP_ENDPOINT}
      region: ${BACKUP_REGION}
      access-key-id: ${BACKUP_ACCESS_KEY_ID}
      secret-access-key: ${BACKUP_SECRET_ACCESS_KEY}
